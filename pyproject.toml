[project]
name = "spanish-morph-tokenizer"
version = "0.1.0"
description = "Morphological tokenizer for Spanish"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "torch>=2.2",
    "transformers>=4.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tokenizer"]
